<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="60%" stop-color="#101115" />
      <stop offset="100%" stop-color="#08080b" />
    </linearGradient>

    <linearGradient id="profileLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8ebf2" />
      <stop offset="40%" stop-color="#b0b7c4" />
      <stop offset="100%" stop-color="#141720" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="rimGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="650" fill="url(#darkBg)" />
  <rect width="500" height="650" fill="url(#rimGlow)" />

  <!-- Subtle Data Stream Grid Lines in Dark Mode -->
  <g opacity="0.12" stroke="#475569" stroke-width="1" stroke-dasharray="4,6">
    <line x1="60" y1="0" x2="60" y2="650" />
    <line x1="180" y1="0" x2="180" y2="650" />
    <line x1="300" y1="0" x2="300" y2="650" />
    <line x1="420" y1="0" x2="420" y2="650" />
    <line x1="0" y1="150" x2="500" y2="150" />
    <line x1="0" y1="350" x2="500" y2="350" />
    <line x1="0" y1="520" x2="500" y2="520" />
  </g>

  <!-- Farjad Side Profile (Facing Left) -->
  <g transform="translate(60, 40)">
    <!-- Shoulders & Coat Base -->
    <path d="M 300 600 C 260 520 220 420 180 390 C 140 370 70 410 20 460 L 0 600 Z" fill="#0d0e12" />
    <path d="M 190 390 L 140 470 L 175 550 L 225 430 Z" fill="#1b1e28" stroke="#2b3140" stroke-width="1" />

    <!-- Neck & Jawline with Dramatic Rim Lighting -->
    <path d="M 230 270 C 210 330 180 380 150 400 L 195 420 C 240 380 270 330 280 270 Z" fill="#1e222d" />
    
    <!-- Face Profile (Forehead, Nose, Lips, Beard, Chin) -->
    <path d="M 220 140 
             C 180 145 160 170 155 195 
             L 135 220 
             L 142 235 
             L 130 255 
             C 130 265 145 275 140 285 
             C 135 295 125 305 135 325 
             C 145 345 180 370 210 370 
             C 250 370 280 330 280 250 
             C 280 170 260 135 220 140 Z" 
          fill="#13161f" />

    <!-- Rim Light on Facial Profile -->
    <path d="M 185 155 
             C 165 175 155 195 152 205 
             L 133 222 
             L 142 236 
             L 128 256 
             C 130 266 142 274 138 286 
             C 132 297 124 308 135 327 
             C 145 345 175 365 205 368" 
          fill="none" stroke="url(#profileLight)" stroke-width="3" stroke-linecap="round" />

    <!-- Groomed Beard Silhouette Texture -->
    <path d="M 135 270 C 130 285 125 310 138 335 C 150 355 180 370 210 370 C 235 370 250 350 255 330 C 220 340 170 330 150 290 Z" 
          fill="#0a0b0e" />

    <!-- Ear Outline -->
    <path d="M 235 230 C 225 230 220 250 228 265 C 232 272 242 275 245 265 Z" fill="none" stroke="#333a4a" stroke-width="1.5" />

    <!-- Styled Wavy Hair on Top (Back & Crown) -->
    <path d="M 215 140 
             C 195 120 220 70 270 60 
             C 320 50 360 85 365 140 
             C 370 195 340 260 300 270 
             C 290 220 285 170 255 145 
             C 240 135 225 135 215 140 Z" 
          fill="#0a0b0e" />

    <!-- Subtle Hair Highlight Arc -->
    <path d="M 230 110 C 260 75 310 70 345 95 C 355 105 340 140 330 150" 
          fill="none" stroke="#2e3547" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Editorial Metadata Floating on Card -->
  <g transform="translate(40, 580)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#10b981" letter-spacing="2">02 // STRATEGY</text>
    <text x="0" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Executive Data Architecture</text>
  </g>
</svg>
